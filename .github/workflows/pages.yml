# Publication du site sur GitHub Pages (https://biblio-b1.github.io/biblio-b1/) à chaque push sur main.
# Le site est statique : il parle directement à Supabase (adresse et clé publiable, publiques par
# conception, déjà dans src/lib/supabase/client.ts). Aucun secret n'est nécessaire ici.
name: Publication github.io

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # postinstall : copie du worker pdf.js et des moteurs WebAssembly dans public/.
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /biblio-b1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
